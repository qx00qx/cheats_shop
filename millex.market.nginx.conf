server {
    server_name millex.market www.millex.market;
    client_max_body_size 510m;

    location ~* ^/uploads/(?:videos/)?(?<millex_video_file>[^/]+\.(?:mp4|webm|ogg|ogv))$ {
        alias /var/lib/millex/uploads/videos/$millex_video_file;
        types {
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogg ogv;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /uploads/game-covers/ {
        alias /var/lib/millex/uploads/game-covers/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /api/accounts/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/millex.market/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/millex.market/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.millex.market) {
        return 301 https://$host$request_uri;
    }

    if ($host = millex.market) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name millex.market www.millex.market;
    return 404;
}
