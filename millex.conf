server {
    server_name millex.market www.millex.market;
    client_max_body_size 510m;

    # Отдаем фронтенд (статику)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Пробрасываем API на контейнер backend
    location /api/ {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/millex.market/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/millex.market/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.millex.market) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = millex.market) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name millex.market www.millex.market;
    return 404; # managed by Certbot




}