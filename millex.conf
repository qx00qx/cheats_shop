server {
    listen 80;
    server_name millex.market www.millex.market 168.113.189.199;

    client_max_body_size 510m;

    # Certbot HTTP-01 challenge files.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Serve uploaded videos directly from persistent storage.
    location ~* ^/uploads/(?:videos/)?(?<millex_video_file>[^/]+\.(?:mp4|webm|ogg|ogv))$ {
        alias /var/lib/millex/uploads/videos/$millex_video_file;
        types {
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogg ogv;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /uploads/game-covers/ {
        alias /var/lib/millex/uploads/game-covers/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other uploaded files are served by the backend.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
